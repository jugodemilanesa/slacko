<!DOCTYPE html>
<html>
<head>
<style>
.container {
    width: max-content;
    max-width: 200px;
    background: lightblue;
    padding: 10px;
    font-family: Arial;
}
</style>
</head>
<body>
<div class="container" id="b"></div>
<script>
const text = "Hola mundo. Esta es una prueba de salto de linea con w-max.";
let b = document.getElementById('b');
let i = 0;
setInterval(() => {
    if (i <= text.length) {
        b.innerText = text.slice(0, i);
        i++;
    }
}, 50);
</script>
</body>
</html>
